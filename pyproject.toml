[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "betelgeuse-observatory"
version = "0.1.0"
description = "Causal, uncertainty-aware analysis tools for Betelgeuse observations"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { text = "BSD-3-Clause" }
dependencies = [
  "numpy==2.5.2",
  "pandas==3.0.5",
  "scipy==1.18.1",
  "astropy==8.0.1",
  "matplotlib==3.11.1",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
ml = [
  "scikit-learn==1.9.0",
  "torch==2.13.0",
  "emcee==3.1.6",
  "specutils==2.4.0",
]
dev = ["pytest==9.1.1", "mypy==2.3.1", "ruff==0.16.5"]

[tool.hatch.build.targets.wheel]
packages = ["science/betelgeuse"]

[tool.pytest.ini_options]
testpaths = ["science/tests"]
addopts = "-ra --strict-markers"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["science/betelgeuse", "science/ingestion", "ml/baselines"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
