name: Data manifest

on:
  push:
    paths:
      [
        'data/**',
        'science/betelgeuse/provenance.py',
        '.github/workflows/data-validation.yml',
      ]
  pull_request:
    paths:
      [
        'data/**',
        'science/betelgeuse/provenance.py',
        '.github/workflows/data-validation.yml',
      ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - run: python science/validate_manifest.py data/manifest.yaml
